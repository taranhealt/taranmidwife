name: backend
on:
  push:
    branches:
      - main
      - infra/android-ci-hardening
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taranmidwife
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: taranmidwife_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taranmidwife"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, xml, ctype, fileinfo, tokenizer, openssl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
        env:
          APP_ENV: testing
          CACHE_STORE: array
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: taranmidwife_test
          DB_USERNAME: taranmidwife
          DB_PASSWORD: ci_password_only
