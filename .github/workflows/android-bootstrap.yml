name: Android project verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify existing Android project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify patient Android project
        run: |
          test -f apps/patient_app/android/app/build.gradle.kts
          test -f apps/patient_app/android/settings.gradle.kts
          test -f apps/patient_app/android/gradle/wrapper/gradle-wrapper.properties
          flutter --version
          java -version

      - name: Explain missing partner app
        run: |
          if [ -d apps/partner_app ]; then
            echo "Partner app directory exists."
          else
            echo "Partner app has not been created yet; no files were generated or pushed."
          fi
