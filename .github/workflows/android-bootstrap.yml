name: Android project verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify existing Android project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify patient Android project
        run: |
          test -f apps/patient_app/android/app/build.gradle.kts
          test -f apps/patient_app/android/settings.gradle.kts
          test -f apps/patient_app/android/gradle/wrapper/gradle-wrapper.properties
          test -f apps/partner_app/android/app/build.gradle.kts
          test -f apps/partner_app/android/settings.gradle.kts
          flutter --version
          java -version
      - name: Verify compileSdk guard remains present
        run: |
          grep -q 'finalizeDsl' apps/patient_app/android/build.gradle.kts
          grep -q 'finalizeDsl' apps/partner_app/android/build.gradle.kts
