name: TaranMidwife Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/taran_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  patient:
    name: Patient Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build staging debug APK
        if: ${{ vars.TARAN_STAGING_API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.TARAN_STAGING_API_BASE_URL }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload staging debug APK
        if: ${{ vars.TARAN_STAGING_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: taranmidwife-patient-staging-debug-apk
          path: apps/patient_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
