name: flutter
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/taran_core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
  patient:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK debug (jika kerangka Android sudah ada)
        if: ${{ hashFiles('apps/patient_app/android/app/build.gradle*') != '' }}
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://midwife.taranrainmaker.biz.id/api/v1

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: taranmidwife-patient-debug-apk
          path: apps/patient_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
