name: TaranMidwife Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/taran_core
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  patient:
    name: Patient Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/patient_app
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build staging debug APK
        if: ${{ vars.TARAN_STAGING_API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.TARAN_STAGING_API_BASE_URL }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Summarize staging APK
        if: ${{ vars.TARAN_STAGING_API_BASE_URL != '' }}
        run: |
          FILE="build/app/outputs/flutter-apk/app-debug.apk"
          SIZE=$(stat -c '%s' "$FILE")
          SHA=$(sha256sum "$FILE" | cut -d ' ' -f 1)
          echo "| taranmidwife-patient-debug-apk | $SIZE bytes | $SHA |" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload staging debug APK
        if: ${{ vars.TARAN_STAGING_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: taranmidwife-patient-debug-apk
          path: apps/patient_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  partner:
    name: Midwife partner Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/partner_app
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build staging debug APK
        if: ${{ vars.TARAN_STAGING_API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.TARAN_STAGING_API_BASE_URL }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Summarize staging APK
        if: ${{ vars.TARAN_STAGING_API_BASE_URL != '' }}
        run: |
          FILE="build/app/outputs/flutter-apk/app-debug.apk"
          SIZE=$(stat -c '%s' "$FILE")
          SHA=$(sha256sum "$FILE" | cut -d ' ' -f 1)
          echo "| taranmidwife-mitra-debug-apk | $SIZE bytes | $SHA |" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload staging debug APK
        if: ${{ vars.TARAN_STAGING_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: taranmidwife-mitra-debug-apk
          path: apps/partner_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-compile:
    name: Patient release bundle compile (unsigned QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/patient_app
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'
      - name: Install dependencies
        run: flutter pub get
      - name: Compile release app bundle (unsigned)
        env:
          API_BASE_URL: ${{ vars.TARAN_STAGING_API_BASE_URL }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Summarize unsigned QA AAB
        run: |
          FILE="build/app/outputs/bundle/release/app-release.aab"
          SIZE=$(stat -c '%s' "$FILE")
          SHA=$(sha256sum "$FILE" | cut -d ' ' -f 1)
          echo "| taranmidwife-patient-release-unsigned-qa | $SIZE bytes | $SHA | UNSIGNED |" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned QA bundle
        uses: actions/upload-artifact@v5
        with:
          name: taranmidwife-patient-release-unsigned-qa
          path: apps/patient_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  partner-release-compile:
    name: Partner release bundle compile (unsigned QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/partner_app
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'
      - name: Install dependencies
        run: flutter pub get
      - name: Compile release app bundle (unsigned)
        env:
          API_BASE_URL: ${{ vars.TARAN_STAGING_API_BASE_URL }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Summarize unsigned QA AAB
        run: |
          FILE="build/app/outputs/bundle/release/app-release.aab"
          SIZE=$(stat -c '%s' "$FILE")
          SHA=$(sha256sum "$FILE" | cut -d ' ' -f 1)
          echo "| taranmidwife-mitra-release-unsigned-qa | $SIZE bytes | $SHA | UNSIGNED |" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned QA bundle
        uses: actions/upload-artifact@v5
        with:
          name: taranmidwife-mitra-release-unsigned-qa
          path: apps/partner_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  signed-aab:
    name: Signed Google Play AAB (${{ matrix.label }})
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.TARAN_ENABLE_SIGNED_AAB == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: patient
            app: patient_app
            artifact: taranmidwife-patient-release-aab
          - label: midwife partner
            app: partner_app
            artifact: taranmidwife-mitra-release-aab
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'
      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ vars.TARAN_PRODUCTION_API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "TARAN_PRODUCTION_API_BASE_URL must be HTTPS"; exit 1 ;;
          esac
      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/taranmidwife-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/taranmidwife-upload.jks" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: flutter pub get
      - name: Build signed app bundle
        env:
          API_BASE_URL: ${{ vars.TARAN_PRODUCTION_API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Upload signed Google Play AAB
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/taranmidwife-upload.jks"
