name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve TaranMidwife.
        Never include real patient information, credentials, or secrets.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide clear, repeatable steps using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Component, version, OS, Flutter/PHP version, if known.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove tokens, personal information, and sensitive data.
